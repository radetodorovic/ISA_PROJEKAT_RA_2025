server.port=8080

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/isa_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=radetodorovic.2001@gmail.com
spring.mail.password=edpumacafdwlgkik 
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT Configuration
jwt.secret=moj-super-tajni-kljuc-koji-mora-biti-dugacak-12345678901234567890
jwt.expiration=86400000

# Rate Limiting
rate.limit.attempts=5
rate.limit.duration=60000
# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
spring.servlet.multipart.file-size-threshold=2KB

# File Storage
file.upload.dir=uploads/videos
file.thumbnail.dir=uploads/thumbnails

# Thumbnail compression (daily)
app.thumbnail.compression.enabled=true
app.thumbnail.compression.cron=0 0 2 * * *
app.thumbnail.compression.age-days=30
app.thumbnail.compression.output.dir=uploads/thumbnails/compressed
app.thumbnail.compression.jpeg-quality=0.75
app.thumbnail.compression.png-compression-level=6

# Upload timeout for storing video (ms)
app.upload.timeout-ms=60000

# Transcoding configuration
app.transcode.enabled=true
app.transcode.ffmpeg-path=C:\\Users\\simac\\AppData\\Local\\Microsoft\\WinGet\\Packages\\Gyan.FFmpeg_Microsoft.Winget.Source_8wekyb3d8bbwe\\ffmpeg-8.0.1-full_build\\bin\\ffmpeg.exe
app.transcode.consumer-count=2
app.transcode.default-profiles=360p,720p
app.transcode.output.dir=uploads/transcoded

# Trending configuration
app.trending.window-days=7
app.trending.weight.view=1
app.trending.weight.like=3
app.trending.weight.comment=5
app.trending.max-per-location=50
app.trending.radius-default-meters=200

# Geo indexing (PostGIS)
app.geo.init=true

# RabbitMQ (optional, used for health checks in cluster mode)
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

# Actuator / health probes
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,rabbit
management.endpoint.health.group.liveness.include=livenessState
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=isa-backend
