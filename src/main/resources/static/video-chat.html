<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Streaming Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .content {
            display: flex;
            height: 600px;
        }

        .video-section {
            flex: 2;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 2px solid #e0e0e0;
        }

        .video-placeholder {
            color: #666;
            text-align: center;
            padding: 20px;
        }

        .video-placeholder h2 {
            color: #999;
            margin-bottom: 10px;
        }

        .chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #f5f5f5;
        }

        .username-form {
            padding: 20px;
            background: white;
            text-align: center;
        }

        .username-form input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .username-form button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s;
        }

        .username-form button:hover {
            transform: translateY(-2px);
        }

        .chat-container {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        .chat-container.active {
            display: flex;
        }

        .chat-header {
            padding: 15px;
            background: white;
            border-bottom: 2px solid #e0e0e0;
            font-weight: 600;
            color: #333;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f5f5;
        }

        .message {
            margin-bottom: 15px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.chat {
            background: white;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .message.join, .message.leave {
            text-align: center;
            padding: 8px;
            font-size: 13px;
            font-style: italic;
            color: #666;
        }

        .message.join {
            color: #4CAF50;
        }

        .message.leave {
            color: #ff9800;
        }

        .message-username {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .message-text {
            color: #333;
            word-wrap: break-word;
        }

        .message-time {
            font-size: 11px;
            color: #999;
            margin-top: 5px;
        }

        .message-input {
            display: flex;
            padding: 15px;
            background: white;
            border-top: 2px solid #e0e0e0;
        }

        .message-input input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px 0 0 8px;
            font-size: 14px;
        }

        .message-input button {
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 0 8px 8px 0;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }

        .message-input button:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }

        .status {
            padding: 10px 20px;
            text-align: center;
            font-size: 12px;
            background: #fff3cd;
            color: #856404;
            border-bottom: 1px solid #ffeaa7;
        }

        .status.connected {
            background: #d4edda;
            color: #155724;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 Video Streaming Chat</h1>
            <p id="videoInfo">Video ID: <span id="currentVideoId">-</span></p>
        </div>

        <div class="status" id="status">Povezivanje...</div>

        <div class="content">
            <div class="video-section">
                <div class="video-placeholder">
                    <h2>🎥 Video Player</h2>
                    <p>Ovde bi bio video stream</p>
                </div>
            </div>

            <div class="chat-section">
                <div class="username-form" id="usernameForm">
                    <h3 style="margin-bottom: 15px;">Pridruži se chatu</h3>
                    <input type="text" id="usernameInput" placeholder="Unesite vaše ime..." maxlength="20">
                    <input type="text" id="videoIdInput" placeholder="Video ID (npr: video123)" maxlength="50">
                    <button onclick="connect()">Pridruži se</button>
                </div>

                <div class="chat-container" id="chatContainer">
                    <div class="chat-header">
                        💬 Chat uživo
                    </div>
                    <div class="messages" id="messages"></div>
                    <div class="message-input">
                        <input type="text" id="messageInput" placeholder="Napišite poruku..." onkeypress="handleKeyPress(event)">
                        <button onclick="sendMessage()">Pošalji</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script>
        let stompClient = null;
        let username = null;
        let videoId = null;

        function setStatus(message, isConnected = false) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = isConnected ? 'status connected' : 'status';
        }

        function connect() {
            username = document.getElementById('usernameInput').value.trim();
            videoId = document.getElementById('videoIdInput').value.trim();

            if (!username || !videoId) {
                alert('Molimo unesite ime i Video ID!');
                return;
            }

            document.getElementById('currentVideoId').textContent = videoId;

            const socket = new SockJS('http://localhost:8080/ws');
            stompClient = Stomp.over(socket);

            stompClient.connect({}, onConnected, onError);
        }

        function onConnected() {
            // Subscribe to the video's chat topic
            stompClient.subscribe('/topic/video/' + videoId + '/chat', onMessageReceived);

            // Send JOIN message
            stompClient.send('/app/chat/' + videoId + '/join',
                {},
                JSON.stringify({
                    username: username,
                    type: 'JOIN'
                })
            );

            document.getElementById('usernameForm').style.display = 'none';
            document.getElementById('chatContainer').classList.add('active');
            setStatus('✓ Povezano', true);
        }

        function onError(error) {
            console.error('WebSocket greška:', error);
            setStatus('✗ Greška pri povezivanju');
        }

        function sendMessage() {
            const messageInput = document.getElementById('messageInput');
            const messageContent = messageInput.value.trim();

            if (messageContent && stompClient) {
                const chatMessage = {
                    username: username,
                    message: messageContent,
                    type: 'CHAT'
                };

                stompClient.send('/app/chat/' + videoId, {}, JSON.stringify(chatMessage));
                messageInput.value = '';
            }
        }

        function onMessageReceived(payload) {
            const message = JSON.parse(payload.body);
            const messagesDiv = document.getElementById('messages');

            const messageElement = document.createElement('div');
            messageElement.classList.add('message', message.type.toLowerCase());

            if (message.type === 'CHAT') {
                messageElement.innerHTML = `
                    <div class="message-username">${escapeHtml(message.username)}</div>
                    <div class="message-text">${escapeHtml(message.message)}</div>
                    <div class="message-time">${formatTime(message.timestamp)}</div>
                `;
            } else {
                messageElement.textContent = message.message;
            }

            messagesDiv.appendChild(messageElement);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.keyCode === 13) {
                sendMessage();
            }
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        function formatTime(timestamp) {
            if (!timestamp) return '';
            const date = new Date(timestamp);
            return date.toLocaleTimeString('sr-RS', { hour: '2-digit', minute: '2-digit' });
        }

        // Disconnect on page unload
        window.addEventListener('beforeunload', () => {
            if (stompClient) {
                stompClient.disconnect();
            }
        });
    </script>
</body>
</html>
